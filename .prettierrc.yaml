# Formatting for this repo. YAML rather than JSON so each value can carry the measurement that chose it — the numbers below were counted off the tree,
# not guessed, and a future edit that disagrees with one should re-count first.
#
# Prettier is deliberately NOT a dependency here and no `format` script exists: this file configures the prettier your editor already runs, for the
# files you touch. A repo-wide pass is a separate decision, not something a config should cause by sitting here.

# The point of the file. Code lines here sit at p50 33, p95 87 — everything typical is already well inside 160, so this mostly stops prettier from
# breaking a line that reads fine whole. It does NOT touch comment interiors: prettier never reflows a comment at any width, so the ~75-column prose
# wrap throughout this tree is governed by ~/.claude/CLAUDE.md, not by this number.
printWidth: 160

# 367 single-quoted imports against 9 double-quoted.
singleQuote: true

# 472 double-quoted JSX attributes against 0 single — prettier's default, kept explicit because it reads as a contradiction of singleQuote above and
# would otherwise look like an oversight.
jsxSingleQuote: false

# 507 multiline closers whose previous line ends without a comma, against 1 that has one. Prettier 3 defaults to "all", which would rewrite all 507 on
# first contact — the single loudest reason to state this file at all.
trailingComma: none

# Rewrap markdown prose to printWidth above. This was `preserve` until 2026-09-15, on the argument that docs here are hand-wrapped and pinned in places
# by tests that read prose, so rewrapping would rewrite blame for no behaviour change. Both halves of that turned out to be answerable. The blame half
# is the cost of applying ~/.claude/CLAUDE.md's 160-column convention to a tree that predates it at all, and it is paid once here rather than a line at
# a time forever; the pinned-prose half was measured rather than assumed, and the full suite stays green — those assertions match substrings, and
# rewrapping only ever makes a phrase MORE contiguous, never less.
#
# What this does NOT do is as important as what it does. `always` rewraps paragraph prose and nothing else: a table keeps its rows, a fenced code block
# is untouched, a list keeps one item per line, and a line with no break opportunity inside 160 (a long URL, a wide table row) is left over-long rather
# than broken. Comment interiors in .ts/.tsx/.mjs are outside this entirely — prettier treats a comment as an opaque block at any printWidth and never
# reflows the words inside one, which is why the ~75-column wrap in code comments survives this setting and is still governed by ~/.claude/CLAUDE.md
# alone.
proseWrap: always
