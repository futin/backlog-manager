# The CI gate for every PR into main (docs/workflows/ci.md). The job id must stay `ci` and no job may set `name:` — the ruleset requires the contexts
# `ci / checks`, `ci / pr-title` and `ci / skills` by exactly those names.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: futin/release-kit/.github/workflows/ci-node.yml@v1
    with:
      # One command that picks what the PR's diff can break (docs/workflows/ci.md §Scoped checks): a docs-only or skills-only PR runs the suites that
      # read those files and skips typecheck and build; anything else — and every push to main — runs `pnpm typecheck`, `pnpm build` and `pnpm test`,
      # the same three an orchestrated item's verification resolves to off package.json. The scope is decided inside the step from the diff alone, never
      # by skipping the job, so an `edited` re-run reaches the same verdict. No `skills-command` is passed: the script already runs the node skills suite
      # whenever skills change, so `ci / skills` reports green without running anything.
      check-commands: |
        node scripts/ci-scope.mjs
