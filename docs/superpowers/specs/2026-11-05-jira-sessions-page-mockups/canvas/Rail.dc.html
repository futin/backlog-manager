<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Side rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#306c0f}a:hover{color:#1f4a08}
</style>
</helmet>
<nav aria-label="Sections" style="width: 220px; min-height: 920px; height: 100%; box-sizing: border-box; padding: 18px 12px; background: #f4f4f3; border-right: 1px solid #eaeae8; font-family: 'Hanken Grotesk', -apple-system, sans-serif; color: #131313; display: flex; flex-direction: column; gap: 4px; font-size: 13px">
<div style="font-weight: 700; font-size: 14px; padding: 0 8px 14px; letter-spacing: -0.01em">backlog-manager<span style="color: #7dc242">▍</span></div>
<div style="padding: 7px 8px; color: #525252">Files</div>
<div style="padding: 7px 8px; color: #525252">GitHub</div>
<div style="padding: 7px 8px; color: #525252">Runs</div>
<div style="padding: 7px 8px; font-weight: 600; display: flex; justify-content: space-between; align-items: center"><span>Jira</span><span style="background: #F5A15C; color: #131313; border-radius: 9px; font-size: 11px; font-weight: 600; padding: 1px 7px">2</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding-left: 14px; border-left: 1px solid #dcdcda; margin-left: 14px">
<a href="#" style="{{boardStyle}}">Board</a>
<a href="#" style="{{sessStyle}}">Sessions</a>
<a href="#" style="{{plainStyle}}">Setup</a>
</div>
<div style="padding: 7px 8px; color: #525252; margin-top: 4px">Settings</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["board","sessions"],"default":"board"},"$preview":{"width":220,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'board';
    const base = 'display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-radius: 6px; text-decoration: none; ';
    const on = base + 'background: #ffffff; color: #131313; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06)';
    const off = base + 'color: #525252';
    return {
      boardStyle: active === 'board' ? on : off,
      sessStyle: active === 'sessions' ? on : off,
      plainStyle: off
    };
  }
}
</script>
</body>
</html>
