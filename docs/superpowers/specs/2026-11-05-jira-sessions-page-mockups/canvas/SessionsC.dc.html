<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sessions option C</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f4f4f3}
a{color:#306c0f}a:hover{color:#1f4a08}
</style>
</helmet>
<div style="width: 100%; min-height: 1140px; display: flex; flex-wrap: wrap; background: #f4f4f3; font-family: 'Hanken Grotesk', -apple-system, sans-serif; color: #131313; font-size: 13px">
<dc-import name="Rail" active="sessions" hint-size="220px,920px"></dc-import>
<main style="flex: 999 1 560px; min-width: 0; padding: 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<header style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 20px; font-weight: 700">Sessions</h1>
<div style="color: #6b6b6b; font-size: 12px">Every linked ticket · read 4 s ago</div>
</div>
<label style="display: flex; align-items: center; gap: 6px; background: #ffffff; border: 1px solid #dcdcda; border-radius: 7px; padding: 5px 10px; color: #6b6b6b"><span>⌕</span><input type="search" aria-label="Search sessions" placeholder="Search sessions" style="border: 0; outline: 0; font: inherit; width: 200px; background: transparent"></label>
</header>
<section aria-label="Live" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 12px; align-items: baseline"><h2 style="margin: 0; font-size: 14px; font-weight: 700">Live</h2><span style="color: #131313; font-weight: 600; font-size: 12px">2 need you</span><span style="color: #6b6b6b; font-size: 12px">1 working</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
<article style="background: #ffffff; border: 1px solid #eaeae8; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0,0,0,.06)">
<div style="{{c.stripStyle}}"><span>{{c.state}}</span><span>{{c.age}}</span></div>
<div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline"><span><span style="color: #6b6b6b; font-size: 11px; margin-right: 6px">{{c.type}}</span><span style="font-weight: 700">{{c.key}}</span></span><span style="color: #6b6b6b; font-size: 11px; text-align: right">{{c.crumb}}</span></div>
<button type="button" style="border: 0; background: transparent; padding: 0; font: inherit; text-align: left; color: #131313; line-height: 1.35">{{c.summary}}</button>
<div style="display: flex; gap: 6px; align-items: center">
<button type="button" style="border: 0; background: #131313; color: #ffffff; border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 12px">{{c.primary}}</button>
<button type="button" style="border: 1px solid #dcdcda; background: #ffffff; border-radius: 6px; padding: 4px 9px; font: inherit; font-size: 12px">{{c.secondary}}</button>
<span style="margin-left: auto; color: #6b6b6b; font-size: 12px">ctx {{c.ctx}}</span>
</div>
</div>
</article>
</sc-for>
</div>
</section>
<section aria-label="History" style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<h2 style="margin: 0 8px 0 0; font-size: 14px; font-weight: 700">History</h2>
<button type="button" style="border: 1px solid #dcdcda; background: #ffffff; border-radius: 7px; padding: 5px 10px; font: inherit; font-size: 12px">Repo: any ▾</button>
<button type="button" style="border: 1px solid #dcdcda; background: #ffffff; border-radius: 7px; padding: 5px 10px; font: inherit; font-size: 12px">Run: any ▾</button>
<div role="group" aria-label="Ended within" style="display: flex; background: #ededec; border-radius: 7px; padding: 2px; margin-left: auto">
<button type="button" style="border: 0; background: transparent; padding: 4px 10px; border-radius: 5px; font: inherit; font-size: 12px; color: #525252">24 h</button>
<button type="button" aria-pressed="true" style="border: 0; background: #ffffff; padding: 4px 10px; border-radius: 5px; font: inherit; font-size: 12px; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08)">7 d</button>
<button type="button" style="border: 0; background: transparent; padding: 4px 10px; border-radius: 5px; font: inherit; font-size: 12px; color: #525252">30 d</button>
<button type="button" style="border: 0; background: transparent; padding: 4px 10px; border-radius: 5px; font: inherit; font-size: 12px; color: #525252">All</button>
</div>
</div>
<dc-import name="SessionTable" mode="ended" hint-size="100%,420px"></dc-import>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1140}}'>
class Component extends DCLogic {
  renderVals() {
    const strip = (bg) => 'display: flex; justify-content: space-between; padding: 5px 12px; font-size: 11px; font-weight: 600; color: #131313; background: ' + bg;
    const cards = [
      { state: 'needs you · permission', age: '2m', stripStyle: strip('#F5A15C'), type: 'Bug', key: 'PAY-131', crumb: 'execute · payments-api · Desktop · Opus', summary: 'Refund webhook retries twice on 502', primary: 'Open in Desktop', secondary: 'Terminal', ctx: '42%' },
      { state: 'needs you · reply', age: '6m', stripStyle: strip('#F5A15C'), type: 'Sub-task', key: 'PAY-120', crumb: 'plan · payments-web · Terminal · Sonnet · in PAY-118', summary: 'Location picker in payout settings', primary: 'Open terminal', secondary: 'Desktop', ctx: '18%' },
      { state: 'working', age: '12s', stripStyle: strip('#7DC242'), type: 'Story', key: 'PAY-118', crumb: 'execute · payments-api · Desktop · Opus', summary: 'Split payouts per merchant location', primary: 'Open in Desktop', secondary: 'Terminal', ctx: '61%' }
    ];
    return { cards };
  }
}
</script>
</body>
</html>
