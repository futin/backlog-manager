<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The board picker on the Jira board page</title>
<link rel="stylesheet" href="jira.css">
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>

<div style="width:520px;height:320px;position:relative;background:#F4F4F3;font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;padding:24px;overflow:hidden">
  <header class="band"><div class="text"><h2>Sprint 42 · mine</h2><p class="sub" style="flex-basis:auto">acme.atlassian.net · 14 issues · polled 8 s ago</p></div><div class="right"><button class="chip" aria-expanded="true">Sprint 42 · mine <svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 6.5 5 3.5 8 6.5"/></svg></button></div></header>
  <div class="popover" style="top:88px;right:24px;width:320px" role="listbox" aria-label="Boards">
    <div class="prow pick on"><span>Sprint 42 · mine</span><span class="cnt">14</span><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg></div>
    <div class="prow pick"><span>Refund flows</span><span class="cnt">9</span></div>
    <div class="prow pick" style="color:var(--ink3)"><span>Billing bugs</span><span class="cnt">sync off</span></div>
  </div>
</div>

</body>
</html>
